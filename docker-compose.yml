version: '3.8'

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: training-db
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Spring Boot backend ─────────────────────────────────────────────────────
  backend:
    build:
      context:    .
      dockerfile: Dockerfile.backend
    container_name: training-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Activate prod profile (uses application-prod.properties)
      SPRING_PROFILES_ACTIVE: prod
      # Override datasource to point at the postgres container
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Secrets – override the values hardcoded in application-prod.properties
      JWT_SECRET:            ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS:  ${CORS_ALLOWED_ORIGINS}

  # ── Expo web frontend (served by Nginx) ─────────────────────────────────────
  frontend:
    build:
      context:    .
      dockerfile: Dockerfile.frontend
      args:
        # /api is a relative path – Nginx proxies it to the backend container
        EXPO_PUBLIC_API_URL: /api
    container_name: training-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
