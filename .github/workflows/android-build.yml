name: Android Build

on:
  # Pushing a version tag (e.g. v1.2.0) builds the production APK and publishes it
  # as that tag's release, like JollyApp's release workflow.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - production

permissions:
  contents: write

jobs:
  build:
    name: EAS build (${{ inputs.profile || 'production' }})
    runs-on: ubuntu-latest
    env:
      # Tag pushes have no inputs, so they fall back to the production profile
      PROFILE: ${{ inputs.profile || 'production' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches app version
        if: github.ref_type == 'tag'
        run: |
          version=$(jq -r '.expo.version' app.json)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match expo.version ${version} in frontend/app.json (expected v${version})"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Gradle dependencies are the bulk of a cold build; reuse them between runs
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      # --local builds on this runner instead of Expo's servers, skipping the free-tier
      # build queue (which regularly took ~1h). Signing credentials still come from EAS.
      - name: Build locally with EAS
        id: build
        run: |
          version=$(jq -r '.expo.version' app.json)
          file="trainingapp-${PROFILE}-${version}-${{ github.run_number }}.apk"
          eas build --platform android --profile "$PROFILE" --local --non-interactive --output "$file"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=frontend/$file" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.build.outputs.version }}"
          apk="${GITHUB_WORKSPACE}/${{ steps.build.outputs.file }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Release for the pushed tag; re-running the workflow replaces the APK
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
            else
              gh release create "$GITHUB_REF_NAME" "$apk" \
                --verify-tag \
                --title "TrainingApp ${version}" \
                --generate-notes
            fi
          else
            tag="android-${PROFILE}-v${version}-${{ github.run_number }}"
            prerelease=""
            [ "$PROFILE" != "production" ] && prerelease="--prerelease"
            gh release create "$tag" "$apk" \
              --target "${{ github.sha }}" \
              --title "Android ${PROFILE} ${version} (build ${{ github.run_number }})" \
              --notes "Built from ${{ github.sha }} with the \`${PROFILE}\` EAS profile." \
              $prerelease
          fi
