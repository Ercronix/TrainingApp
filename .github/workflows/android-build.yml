name: Android Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - production

permissions:
  contents: write

jobs:
  build:
    name: EAS build (${{ inputs.profile }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build on EAS
        id: eas
        run: |
          eas build --platform android --profile ${{ inputs.profile }} --non-interactive --wait --json > build.json
          url=$(jq -r '.[0].artifacts.buildUrl' build.json)
          version=$(jq -r '.[0].appVersion' build.json)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        id: download
        run: |
          url='${{ steps.eas.outputs.url }}'
          file="trainingapp-${{ inputs.profile }}-${{ steps.eas.outputs.version }}-${{ github.run_number }}.${url##*.}"
          curl -fsSL "$url" -o "$file"
          echo "file=frontend/$file" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-${{ inputs.profile }}-v${{ steps.eas.outputs.version }}-${{ github.run_number }}"
          gh release create "$tag" "${GITHUB_WORKSPACE}/${{ steps.download.outputs.file }}" \
            --target "${{ github.sha }}" \
            --title "Android ${{ inputs.profile }} ${{ steps.eas.outputs.version }} (build ${{ github.run_number }})" \
            --notes "EAS build: ${{ steps.eas.outputs.url }}" \
            ${{ inputs.profile != 'production' && '--prerelease' || '' }}
