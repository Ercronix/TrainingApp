name: Android Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - production

permissions:
  contents: write

jobs:
  build:
    name: EAS build (${{ inputs.profile }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle dependencies are the bulk of a cold build; reuse them between runs
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      # --local builds on this runner instead of Expo's servers, skipping the free-tier
      # build queue (which regularly took ~1h). Signing credentials still come from EAS.
      - name: Build locally with EAS
        id: build
        run: |
          version=$(jq -r '.expo.version' app.json)
          ext=${{ inputs.profile == 'production' && 'aab' || 'apk' }}
          file="trainingapp-${{ inputs.profile }}-${version}-${{ github.run_number }}.${ext}"
          eas build --platform android --profile ${{ inputs.profile }} --local --non-interactive --output "$file"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=frontend/$file" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-${{ inputs.profile }}-v${{ steps.build.outputs.version }}-${{ github.run_number }}"
          gh release create "$tag" "${GITHUB_WORKSPACE}/${{ steps.build.outputs.file }}" \
            --target "${{ github.sha }}" \
            --title "Android ${{ inputs.profile }} ${{ steps.build.outputs.version }} (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }} with the \`${{ inputs.profile }}\` EAS profile." \
            ${{ inputs.profile != 'production' && '--prerelease' || '' }}
