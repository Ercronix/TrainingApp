name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR runs: cancelling a main run could stop a deploy halfway
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-checks:
    name: Frontend lint + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --ci

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/training-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # Tests start their own Postgres through Testcontainers (Docker is preinstalled
      # on ubuntu-latest) and use the test defaults in src/test/resources/config.
      - run: ./gradlew test --no-daemon

  # Deploys main to the server through a self-hosted runner there (setup: docs/deployment.md).
  # Never runs for pull requests, so code from forks can't reach the server through this job.
  deploy:
    name: Deploy to production
    needs: [frontend-checks, backend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, training-deploy]
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
    steps:
      # No actions/checkout: the deploy runs in the existing checkout, which holds .env
      - name: Update the checkout
        run: |
          test -n "$DEPLOY_DIR" || { echo "Set the DEPLOY_DIR repository variable"; exit 1; }
          cd "$DEPLOY_DIR"
          test "$(git branch --show-current)" = main || { echo "$DEPLOY_DIR is not on main"; exit 1; }
          git fetch origin main
          # Fails instead of discarding local changes or commits on the server
          git merge --ff-only "$GITHUB_SHA"
      # --wait returns once Postgres and the backend report healthy (Flyway has migrated)
      - name: Rebuild and restart
        working-directory: ${{ vars.DEPLOY_DIR }}
        run: docker compose up -d --build --remove-orphans --wait --wait-timeout 300
      - name: Remove dangling images
        run: docker image prune -f
