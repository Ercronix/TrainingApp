version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend/training-backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Expo pins these to the SDK version; upgrade them together with
      # `npx expo install --fix` on an SDK bump, not one by one.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "babel-preset-expo"
      - dependency-name: "jest-expo"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
