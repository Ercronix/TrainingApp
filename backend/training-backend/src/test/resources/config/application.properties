# Test-only defaults, so tests run without the gitignored application-local.properties
# (e.g. in CI or a fresh worktree). That file and environment variables still override them.
jwt.secret=test-only-secret-do-not-use-in-production-0123456789abcdef
cors.allowed.origins=http://localhost

# Tests register many users from MockMvc's one address, so the rate limits are out of the way
# (AuthRateLimitTest sets its own low ones)
auth.rate-limit.login-per-ip.limit=100000
auth.rate-limit.login-per-username.limit=100000
auth.rate-limit.register-per-ip.limit=100000
auth.rate-limit.refresh-per-ip.limit=100000
auth.rate-limit.stretch-reminder-per-ip.limit=100000
