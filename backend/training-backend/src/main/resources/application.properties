spring.application.name=training-backend
server.port=8080
server.address=0.0.0.0

spring.profiles.active=local

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/training_db
spring.datasource.username=training_user
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT defaults (can be overridden per profile or via environment variables)
# Access token: 1 hour. Refresh tokens keep the user signed in for longer.
jwt.expiration=3600000
jwt.refresh-expiration-days=60

# Rate limits on the public endpoints against brute force (in memory, per backend instance).
# Each allows <limit> requests per fixed <window>; over it the client gets a 429 with Retry-After.
# Login per IP counts every attempt; it is generous because many users can share one IP.
auth.rate-limit.login-per-ip.limit=30
auth.rate-limit.login-per-ip.window=1m
# Login per username (case and surrounding spaces ignored) counts attempts since the last
# successful login; once used up, even the right password is refused until the window ends.
auth.rate-limit.login-per-username.limit=10
auth.rate-limit.login-per-username.window=15m
auth.rate-limit.register-per-ip.limit=10
auth.rate-limit.register-per-ip.window=1h
auth.rate-limit.refresh-per-ip.limit=60
auth.rate-limit.refresh-per-ip.window=1m
# The stretch reminder's "Done" link, whose secret token stands in for a login
auth.rate-limit.stretch-reminder-per-ip.limit=20
auth.rate-limit.stretch-reminder-per-ip.window=1m
# Most IPs/usernames each limit tracks, which bounds the memory an attacker can make it use
auth.rate-limit.max-keys=50000
# Reverse proxies (IPs or CIDR ranges, comma separated) whose X-Forwarded-For is believed when
# finding the client IP. Empty: none, the connection's address is used (local dev, no proxy).
# docker-compose.yml sets this for the Nginx deployment.
auth.rate-limit.trusted-proxies=

# Logging
logging.level.root=INFO
logging.level.de.mornhinweg.trainingbackend=DEBUG